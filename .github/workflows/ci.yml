name: CI

# WHEN this workflow runs — "on every push to any branch, and on every pull request"
on:
  push:
  pull_request:

jobs:
  lint:
    # WHAT MACHINE this job runs on — GitHub provides free hosted runners
    runs-on: ubuntu-latest

    steps:
      # Step 1: pull your repo's code onto the runner machine
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: install Python on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: install flake8 (just the linter — not your full pyspark dependencies,
      # since linting doesn't need to actually execute Spark code)
      - name: Install flake8
        run: pip install flake8

      # Step 4: run the actual lint check
      - name: Lint with flake8
        run: flake8 scripts/ --max-line-length=100